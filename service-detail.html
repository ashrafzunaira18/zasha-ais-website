                <h3 class="font-bold text-slate-900 text-base">What is During Production Inspection?</h3>
                <p class="text-sm text-slate-600 leading-relaxed">
                  During Production Inspection (DPI / DUPRO) is an on-site quality check performed on the active factory floor while garments are still on the sewing and finishing lines, ensuring defects are caught before bulk manufacturing completes.
                </p>
              </div>

              <div class="p-4 sm:p-5 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                <h3 class="font-bold text-slate-900 text-base">When should DPI be conducted?</h3>
                <p class="text-sm text-slate-600 leading-relaxed">
                  DPI should be scheduled once the manufacturing lines are stabilized, typically when approximately 20% to 60% of your order is completed through stitching and initial finishing.
                </p>
              </div>

              <div class="p-4 sm:p-5 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                <h3 class="font-bold text-slate-900 text-base">What percentage of production should be completed?</h3>
                <p class="text-sm text-slate-600 leading-relaxed">
                  We recommend dispatching inspectors when at least 20% is stitched and some finished pieces are coming off the line, giving enough volume to identify systemic pattern issues early.
                </p>

              <div class="p-4 sm:p-5 rounded-xl bg-slate-50 border border-slate-200 space-y-2">

                <p class="text-sm text-slate-600 leading-relaxed">
                  Our inspectors check workmanship, seam strength, dimensions & measurements against tech pack, fabric quality, trims & accessories, labeling, and active sewing line workflow.
                </p>
              </div>

              <div class="p-4 sm:p-5 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                <h3 class="font-bold text-slate-900 text-base">Is AQL used during During Production Inspection?</h3>
                <p class="text-sm text-slate-600 leading-relaxed">
                  Yes, statistical sampling plans (such as ISO 2859-1 / ANSI/ASQ Z1.4, commonly AQL 2.5 Major / 4.0 Minor or client-specified levels) are applied to finished garments, while inline audits assess active sewing lines.
                </p>
              </div>

              <div class="p-4 sm:p-5 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                <h3 class="font-bold text-slate-900 text-base">What documents are required?</h3>
